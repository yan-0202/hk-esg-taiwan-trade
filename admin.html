<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="qa-session" content="__QA_SESSION_TOKEN__"><title>課堂問答管理｜貿易的下一層</title>
<style>body{margin:0;background:#f0eee4;color:#2b2522;font:17px/1.7 system-ui,sans-serif}main{max-width:600px;margin:6vh auto;padding:32px}section{padding:32px;background:#fffdf7;border-radius:24px;box-shadow:0 15px 45px #2b252212}h1{font-size:32px;margin:8px 0}label{display:block;margin-top:20px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #ccc8bc;border-radius:12px;font-size:16px;background:#f9f8f3}button,a{font:inherit}button{border:0;border-radius:12px;padding:13px 18px;background:#2b2522;color:#fff;cursor:pointer;margin:18px 6px 0 0}button.secondary{background:#e4eadd;color:#2b2522}button.stop{background:#eed9db;color:#2b2522}button:disabled{opacity:.5}p{margin:12px 0}small{color:#6f6a61}#status{white-space:pre-wrap;min-height:60px;padding:16px;background:#f0eee4;border-radius:12px}a{color:inherit}</style>
<main><small>CLASSROOM / OWNER ONLY</small><h1>上課開放，下課關閉。</h1><p>這是報告者的管理頁。同學只需使用<a href="/#qa">專題問答入口 ↗</a>。</p><section><form id="form"><label for="password">管理密碼</label><input id="password" type="password" autocomplete="off" required><label for="key">Gemini API 金鑰</label><input id="key" type="password" autocomplete="off" placeholder="只貼金鑰，不要貼網址"><small>金鑰只留在服務記憶體；重啟或關閉課堂後清除。</small><div><button type="submit">開放課堂 2 小時 ↗</button><button class="secondary" type="button" id="verify">驗證 Google 連線</button><button class="stop" type="button" id="close">下課・關閉問答</button></div></form><p id="status" role="status" aria-live="polite">請輸入管理密碼及金鑰。每次服務啟動最多 60 次雲端嘗試，全班共用間隔 12 秒。重新設定金鑰不會重設次數。</p><small>免費額度由 Google 決定；請使用未啟用計費的專案。開放課堂後，持有網址的人都能提問。關閉後已送出的請求可能仍會完成。Render 免費服務閒置後會休眠，喚醒需等待。</small></section></main>
<script type="module">
const form=document.getElementById('form'),password=document.getElementById('password'),key=document.getElementById('key'),status=document.getElementById('status');
async function send(path,body){if(!(password instanceof HTMLInputElement)||!(status instanceof HTMLElement))return;const buttons=document.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);status.textContent='正在處理…';try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-QA-Admin':password.value,'X-QA-Session':document.querySelector('meta[name="qa-session"]')?.getAttribute('content')||''},body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});const data=await response.json();if(!response.ok)throw new Error(data.error||'操作失敗');status.textContent=data.note||'操作完成';if(path==='/api/config'&&key instanceof HTMLInputElement)key.value='';}catch(error){status.textContent=error instanceof Error?error.message:String(error);}finally{buttons.forEach(b=>b.disabled=false);}}
form?.addEventListener('submit',e=>{e.preventDefault();if(key instanceof HTMLInputElement)void send('/api/config',{api_key:key.value.trim()});});document.getElementById('verify')?.addEventListener('click',()=>void send('/api/check',{}));document.getElementById('close')?.addEventListener('click',()=>void send('/api/close',{}));
</script></html>
